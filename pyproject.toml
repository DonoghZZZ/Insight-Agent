[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "insight-agent"
version = "1.0.0"
description = "智能数据分析爬虫智能体"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Insight Team"}
]
keywords = ["data-analysis", "crawler", "ai-agent", "insight"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",
    "openai>=1.0.0",
    "jieba>=0.42.0",
    "snownlp>=0.12.0",
    "playwright>=1.40.0",
    "pandas>=1.4.0",
    "flask>=3.0.0",
    "pyfiglet>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "flake8>=6.0.0",
    "black>=23.0.0",
    "isort>=5.0.0",
    "mypy>=1.0.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/your-org/insight-agent"
Documentation = "https://insight-agent.readthedocs.io"
Repository = "https://github.com/your-org/insight-agent"
Issues = "https://github.com/your-org/insight-agent/issues"

[project.scripts]
insight = "main:main"

[tool.black]
line-length = 120
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.flake8]
max-line-length = 120
ignore = ["E501", "W503"]
exclude = ["agent_core", "__pycache__", ".git"]
